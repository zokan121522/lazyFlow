[workspace]
resolver = "3"
members = [
    "crates/flow-core",
    "crates/flow-server",
    "crates/flow-tui",
    "crates/flow",
    "crates/flow-cli",
]

[workspace.package]
version = "0.7.0-nightly"
edition = "2024"
license = "MIT"
repository = "https://github.com/juanknebel/flow"

[workspace.dependencies]
flow-core = { path = "crates/flow-core" }
flow-server = { path = "crates/flow-server" }
flow-tui  = { path = "crates/flow-tui" }
axum      = "0.8"
bcrypt    = "0.16"
chrono    = { version = "0.4", features = ["serde"] }
clap      = { version = "4", features = ["derive"] }
crossterm = "0.29.0"
jsonwebtoken = "9.3"
ratatui   = "0.30.0"
reqwest   = { version = "0.13.1", default-features = false, features = ["blocking", "json", "rustls"] }
serde     = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2      = "0.10"
sqlx      = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "migrate"] }
tokio     = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors"] }
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid      = { version = "1", features = ["v4", "serde"] }
